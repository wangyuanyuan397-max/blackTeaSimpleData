# Common training config for the BaSiC-preprocessed 01234 grid30 408 dataset.
# Dataset source: datasets_01234_BaSic, generated by tools/data012345/BaSiC/apply_basic_then_grid30.py.
experiment_name: fixed_split_01234_BaSic_grid30_408_ce

dataset_root: datasets_01234_BaSic
runs_root: runs_01234_BaSic_grid30_408

# Keep the same seed as the other 01234 runs for comparable experiments.
random_seed: 2026

# Time-code folder names must be quoted so YAML does not parse 00 as a number.
class_to_idx:
  "00": 0
  "10": 1
  "20": 2
  "30": 3
  "40": 4

# BaSiC grid30 output is already 408x408 patches; keep training input at 408.
data:
  type: image_folder
  image_size: 408
  train_transform:
    type: patch_train_224
    image_size: 408
  eval_transform:
    type: patch_eval_224
    image_size: 408
  test_transform:
    type: patch_eval_224
    image_size: 408

# Keep hyperparameters aligned with the existing 01234 grid30 408 baseline.
train:
  epochs: 150
  batch_size: 32
  val_batch_size: 64
  test_batch_size: 64
  accumulation_steps: 1
  num_workers: 4
  weighted_sampler: false
  patience: 30
  selection_metric: val_acc
  selection_mode: max
  selection_min_delta: 0.0
  enable_error_analysis: false
  error_analysis_save_images: false
  tta_mode: mean
  tta_topk: 0
  tta_compare: false
  tta_compare_modes: []
  keep_pth_files: false

optimizer:
  type: adamw
  lr: 0.0001
  weight_decay: 0.0005

scheduler:
  type: cosine
  warmup_epochs: 2
  min_lr: 0.000001

loss:
  type: cross_entropy
  label_smoothing: 0.0
