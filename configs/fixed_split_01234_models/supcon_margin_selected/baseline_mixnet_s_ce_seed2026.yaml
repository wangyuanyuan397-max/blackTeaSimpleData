# 原始 MixNet-S + Linear + CE baseline；保持单视图训练增强。
name: baseline_mixnet_s_ce_seed2026
random_seed: 2026
model:
  type: classifier
  strategy: classification
  backbone:
    type: timm
    model_name: mixnet_s
    pretrained: true
    input_size: 408
  head:
    type: linear
    drop_rate: 0.0
loss:
  type: cross_entropy
  label_smoothing: 0.0
# 这里不再覆盖 optimizer.lr，直接继承 fixed_split_01234_BaSic_grid30_408_train.yaml。
# 这样 baseline 与你平时跑的原始 MixNet-S 保持同一套公共训练变量。
