name: lm14_skip_b2_to_b4
random_seed: 2026
model:
  type: classifier
  strategy: classification
  backbone:
    type: mixnet_s_litemono
    model_name: mixnet_s
    pretrained: true
    input_size: 408
    stage_skip_pairs:
      - [2, 4]
    skip_layer_scale_init: 0.0
  head:
    type: linear
    drop_rate: 0.0
litemono:
  group: cross_stage
  pair: blocks_2_to_blocks_4
