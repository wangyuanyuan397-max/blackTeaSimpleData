name: lm09_hdm_all_dilated
random_seed: 2026
model:
  type: classifier
  strategy: classification
  backbone:
    type: mixnet_s_litemono
    model_name: mixnet_s
    pretrained: true
    input_size: 408
    mixedconv_replacement: all_dilated
  head:
    type: linear
    drop_rate: 0.0
litemono:
  group: hybrid_dilated_mixconv
  rule: replace_all_mixconv_branches_with_dilated_3x3
  note: aggressive_control
