name: fourier_d5_s2b3_s3b2
random_seed: 2026
model:
  type: classifier
  strategy: classification
  backbone:
    type: mixnet_s_fourier
    model_name: mixnet_s
    pretrained: true
    input_size: 408
    fourier_blocks:
      - S2B3
      - S3B2
    frequency_ratio: 0.25
    low_frequency_radius_ratio: 0.35
    reduction: 4
    residual_scale_init: 0.0
    min_frequency_channels: 1
    fourier_checkpoint: false
  head:
    type: linear
    drop_rate: 0.0
fourier:
  tag: D5
  blocks:
    - blocks[2][3]
    - blocks[3][2]
  purpose: middle_plus_mid_high_frequency
