name: ortho_m04_normal_cutmix_selfmix_rotation
orthoshot_variant: M04
random_seed: 2026
model:
  type: classifier
  strategy: classification
  backbone: {type: timm, model_name: mixnet_s, pretrained: true, input_size: 408}
  head: {type: linear, drop_rate: 0.0}
train:
  batch_size: 8
  accumulation_steps: 4
  orthoshot:
    enabled: true
    augmentation: {mode: none, cutmix_alpha: 1.0, selfmix_probability: 0.5, selfmix_patch_ratio: 0.33, rotation_degrees: 15}
    maxup: {enabled: true, candidates: [normal, cutmix, selfmix, rotation]}
