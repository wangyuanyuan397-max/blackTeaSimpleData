apiVersion: v1
kind: Pod
metadata:
  name: black-tea-dataset-loader
  namespace: p-wyy-black-tea-dev
  labels:
    app.kubernetes.io/name: black-tea-simple-data
    app.kubernetes.io/component: dataset-loader
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: loader
      image: docker.io/library/python:3.11-slim
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - sleep 7d
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: dataset
          mountPath: /data/datasets
  volumes:
    - name: dataset
      persistentVolumeClaim:
        claimName: black-tea-dataset

